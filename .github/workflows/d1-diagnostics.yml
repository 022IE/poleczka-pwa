name: D1 Diagnostics

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/d1-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: Inspect D1 schema
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: List D1 databases
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 list

      - name: Inspect poleczka-dev schema
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT type, name, tbl_name, sql FROM sqlite_master WHERE type IN ('table','index','trigger','view') AND name NOT LIKE 'sqlite_%' ORDER BY type,name;"

      - name: Inspect poleczka-loyverse schema
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-loyverse --remote --command "SELECT type, name, tbl_name, sql FROM sqlite_master WHERE type IN ('table','index','trigger','view') AND name NOT LIKE 'sqlite_%' ORDER BY type,name;"

      - name: Check poleczka-loyverse foreign keys
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-loyverse --remote --command "PRAGMA foreign_key_check;"

      - name: Inspect Loyverse webhook D1 binding
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          const token = process.env.CLOUDFLARE_API_TOKEN
          const scriptName = 'poleczka-loyverse-webhook'
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts/${scriptName}/settings`, {
            headers: { Authorization: `Bearer ${token}` },
          })
          const payload = await response.json().catch(() => null)
          if (!response.ok || !payload?.success) {
            const messages = payload?.errors?.map((item) => item?.message).filter(Boolean).join('; ') || `HTTP ${response.status}`
            throw new Error(`Unable to inspect Worker settings: ${messages}`)
          }
          const d1Bindings = (payload.result?.bindings ?? [])
            .filter((binding) => binding?.type === 'd1')
            .map((binding) => ({ name: binding.name, type: binding.type, database_id: binding.database_id ?? binding.id ?? null }))
          console.log(JSON.stringify({ scriptName, d1Bindings }, null, 2))
          NODE
