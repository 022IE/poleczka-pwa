name: D1 Analyze 2026-09-09 reconstruction

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/d1-analyze-2026-09-09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Receipt lines schema
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "PRAGMA table_info(receipt_lines);"
