name: D1 Analyze 2026-09-09 reconstruction

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/d1-analyze-2026-09-09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Receipt lines schema
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "PRAGMA table_info(receipt_lines);"

      - name: Exact price and delivery matches
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT ROUND(COALESCE(l.total_money,l.price),2) AS sale_price,TRIM(l.line_note) AS delivery,l.item_name,l.sku,COUNT(*) AS uses,GROUP_CONCAT(DISTINCT l.receipt_number) AS receipts FROM receipt_lines l WHERE (ROUND(COALESCE(l.total_money,l.price),2)=40 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=69 AND TRIM(l.line_note)='1') OR (ROUND(COALESCE(l.total_money,l.price),2)=10 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=20 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=29 AND TRIM(l.line_note) IN ('0','2')) OR (ROUND(COALESCE(l.total_money,l.price),2)=24 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=30 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=28 AND TRIM(l.line_note) IN ('1','2')) OR (ROUND(COALESCE(l.total_money,l.price),2)=80 AND TRIM(l.line_note)='0') GROUP BY sale_price,delivery,l.item_name,l.sku ORDER BY sale_price,delivery,uses DESC,l.item_name;"

      - name: Price grid for deliveries 0 1 2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT TRIM(l.line_note) AS delivery,ROUND(COALESCE(l.total_money,l.price),2) AS sale_price,l.item_name,l.sku,COUNT(*) AS uses FROM receipt_lines l WHERE TRIM(l.line_note) IN ('0','1','2') AND COALESCE(l.total_money,l.price) BETWEEN 5 AND 90 GROUP BY delivery,sale_price,l.item_name,l.sku ORDER BY delivery,sale_price,uses DESC,l.item_name;"

      - name: Exact matches with source provenance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT ROUND(COALESCE(l.total_money,l.price),2) AS sale_price,TRIM(l.line_note) AS delivery,l.item_name,l.sku,r.source,COUNT(*) AS uses,GROUP_CONCAT(DISTINCT l.receipt_number) AS receipts FROM receipt_lines l JOIN receipts r ON r.receipt_number=l.receipt_number WHERE ((ROUND(COALESCE(l.total_money,l.price),2)=40 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=69 AND TRIM(l.line_note)='1') OR (ROUND(COALESCE(l.total_money,l.price),2)=10 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=20 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=29 AND TRIM(l.line_note) IN ('0','2')) OR (ROUND(COALESCE(l.total_money,l.price),2)=24 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=30 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=28 AND TRIM(l.line_note) IN ('1','2')) OR (ROUND(COALESCE(l.total_money,l.price),2)=80 AND TRIM(l.line_note)='0')) GROUP BY sale_price,delivery,l.item_name,l.sku,r.source ORDER BY sale_price,delivery,r.source,uses DESC,l.item_name;"

      - name: Any 80 PLN historical items
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT ROUND(COALESCE(l.total_money,l.price),2) AS sale_price,TRIM(l.line_note) AS delivery,l.item_name,l.sku,r.source,l.receipt_number FROM receipt_lines l JOIN receipts r ON r.receipt_number=l.receipt_number WHERE ROUND(COALESCE(l.total_money,l.price),2) BETWEEN 75 AND 85 ORDER BY ABS(ROUND(COALESCE(l.total_money,l.price),2)-80),r.source,l.item_name;"
