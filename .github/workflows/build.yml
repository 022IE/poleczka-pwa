name: Build PWA

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - 'status/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'status/**'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build
