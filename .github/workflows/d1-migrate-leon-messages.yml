name: D1 migrate Leon messages

on:
  push:
    branches:
      - dev
    paths:
      - migrations/0002_leon_messages.sql
      - .github/workflows/d1-migrate-leon-messages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-migrate-leon-messages
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Leon messages migration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply D1 migrations to poleczka-dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest d1 migrations apply poleczka-dev --remote

      - name: Verify Leon messages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "
            SELECT COUNT(*) AS messages, COUNT(DISTINCT message) AS unique_messages FROM leon_messages;
            SELECT COUNT(*) AS history_rows FROM leon_message_history;
          "
