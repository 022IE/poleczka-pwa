name: D1 Compare 2026-09-11 sales

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/d1-compare-2026-09-11.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Receipt lines schema
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "PRAGMA table_info(receipt_lines);"

      - name: Receipts on 2026-09-11
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT receipt_number,receipt_date,total_money,source FROM receipts WHERE date(receipt_date,'+2 hours')='2026-09-11' ORDER BY receipt_date,receipt_number;"

      - name: Lines on 2026-09-11
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT r.receipt_number,r.receipt_date,l.item_name,l.sku,l.quantity,l.price,l.total_money,l.line_note FROM receipts r JOIN receipt_lines l ON l.receipt_number=r.receipt_number WHERE date(r.receipt_date,'+2 hours')='2026-09-11' ORDER BY r.receipt_date,r.receipt_number,l.line_id;"

      - name: Payments on 2026-09-11
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT p.receipt_number,p.name,p.type,p.money_amount,p.paid_at FROM receipt_payments p JOIN receipts r ON r.receipt_number=p.receipt_number WHERE date(r.receipt_date,'+2 hours')='2026-09-11' ORDER BY r.receipt_date,r.receipt_number;"
