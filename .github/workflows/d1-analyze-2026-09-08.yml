name: D1 Analyze 2026-09-08 sales reconstruction

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/d1-analyze-2026-09-08.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exact price and delivery matches
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT ROUND(COALESCE(l.total_money,l.price),2) AS sale_price,TRIM(l.line_note) AS delivery,l.item_name,l.sku,COUNT(*) AS uses,GROUP_CONCAT(DISTINCT l.receipt_number) AS receipts FROM receipt_lines l WHERE (ROUND(COALESCE(l.total_money,l.price),2)=40 AND TRIM(l.line_note) IN ('0','1','2')) OR (ROUND(COALESCE(l.total_money,l.price),2)=15 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=10 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=30 AND TRIM(l.line_note)='2') OR (ROUND(COALESCE(l.total_money,l.price),2)=45 AND TRIM(l.line_note) IN ('0','1')) OR (ROUND(COALESCE(l.total_money,l.price),2)=55 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=5 AND TRIM(l.line_note)='2') OR (ROUND(COALESCE(l.total_money,l.price),2)=25 AND TRIM(l.line_note)='2') OR (ROUND(COALESCE(l.total_money,l.price),2)=150 AND TRIM(l.line_note)='2') OR (ROUND(COALESCE(l.total_money,l.price),2)=65 AND TRIM(l.line_note)='1') GROUP BY sale_price,delivery,l.item_name,l.sku ORDER BY sale_price,delivery,uses DESC,l.item_name;"

      - name: Price grid for relevant deliveries
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT TRIM(l.line_note) AS delivery,ROUND(COALESCE(l.total_money,l.price),2) AS sale_price,l.item_name,l.sku,COUNT(*) AS uses FROM receipt_lines l WHERE TRIM(l.line_note) IN ('0','1','2') AND COALESCE(l.total_money,l.price) BETWEEN 3 AND 160 GROUP BY delivery,sale_price,l.item_name,l.sku ORDER BY delivery,sale_price,uses DESC,l.item_name;"
