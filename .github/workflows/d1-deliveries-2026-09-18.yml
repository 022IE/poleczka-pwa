name: D1 Deliveries Migration 2026-09-18

on:
  push:
    branches:
      - dev
    paths:
      - scripts/migrate-deliveries-2026-09-18.mjs
      - .github/workflows/d1-deliveries-2026-09-18.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-deliveries-2026-09-18
  cancel-in-progress: false

jobs:
  migrate:
    name: Create deliveries and canonical delivery_number
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Migrate poleczka-dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: 099b4d9e-ad73-441b-a2be-a00f347a5905
          LOYVERSE_WORKER_NAME: poleczka-loyverse-webhook
        run: node scripts/migrate-deliveries-2026-09-18.mjs
