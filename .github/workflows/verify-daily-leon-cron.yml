name: Verify Daily Leon cron

on:
  push:
    branches:
      - dev
    paths:
      - wrangler.toml
      - worker/index.ts
      - .github/workflows/verify-daily-leon-cron.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-daily-leon-cron
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Cloudflare cron trigger
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Verify hourly schedule
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response=""

          for attempt in $(seq 1 30); do
            response="$(curl -fsS \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/poleczka-pwa/schedules" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json")"

            if echo "$response" | jq -e '
              .success == true
              and (.result.schedules | map(.cron) | index("0 * * * *") != null)
            ' >/dev/null; then
              echo "Daily Leon cron is attached: 0 * * * *"
              exit 0
            fi

            sleep 10
          done

          echo "Expected Daily Leon cron trigger was not found."
          echo "$response" | jq .
          exit 1
