name: D1 migrate Daily Leon recommendations

on:
  push:
    branches:
      - dev
    paths:
      - migrations/0003_leon_daily_recommendations.sql
      - .github/workflows/d1-migrate-leon-daily-recommendations.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-migrate-leon-daily-recommendations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Daily Leon migration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply D1 migrations to poleczka-dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest d1 migrations apply poleczka-dev --remote

      - name: Verify Daily Leon table
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "
            SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'leon_daily_recommendations';
            SELECT COUNT(*) AS recommendation_rows FROM leon_daily_recommendations;
          "
