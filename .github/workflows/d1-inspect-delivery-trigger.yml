name: D1 Inspect delivery migration triggers

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/d1-inspect-delivery-trigger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect receipt_lines migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "PRAGMA table_info(receipt_lines); SELECT name,sql FROM sqlite_master WHERE type='trigger' AND tbl_name='receipt_lines' ORDER BY name;"
