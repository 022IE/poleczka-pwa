name: D1 Analyze price-item matches 07-09

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/d1-analyze-price-item-07-09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact price matches
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT ROUND(COALESCE(l.total_money,l.price),2) AS sale_price,l.item_name,l.sku,COUNT(*) AS uses,GROUP_CONCAT(DISTINCT l.receipt_number) AS receipts FROM receipt_lines l WHERE ROUND(COALESCE(l.total_money,l.price),2) IN (5,10,20,24,25,29,30,32,35,45,49,54,55,65,69) GROUP BY sale_price,l.item_name,l.sku ORDER BY sale_price,uses DESC,l.item_name;"
      - name: Nearby price context
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT ROUND(COALESCE(l.total_money,l.price),2) AS sale_price,l.item_name,l.sku,COUNT(*) AS uses FROM receipt_lines l WHERE COALESCE(l.total_money,l.price) BETWEEN 3 AND 72 GROUP BY sale_price,l.item_name,l.sku ORDER BY sale_price,uses DESC,l.item_name;"
      - name: Exact price and delivery matches
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT ROUND(COALESCE(l.total_money,l.price),2) AS sale_price,TRIM(l.line_note) AS delivery,l.item_name,l.sku,COUNT(*) AS uses,GROUP_CONCAT(DISTINCT l.receipt_number) AS receipts FROM receipt_lines l WHERE (ROUND(COALESCE(l.total_money,l.price),2)=10 AND TRIM(l.line_note) IN ('0','2')) OR (ROUND(COALESCE(l.total_money,l.price),2)=20 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=24 AND TRIM(l.line_note)='2') OR (ROUND(COALESCE(l.total_money,l.price),2)=25 AND TRIM(l.line_note) IN ('0','3')) OR (ROUND(COALESCE(l.total_money,l.price),2)=29 AND TRIM(l.line_note) IN ('0','3','5')) OR (ROUND(COALESCE(l.total_money,l.price),2)=30 AND TRIM(l.line_note)='0') OR (ROUND(COALESCE(l.total_money,l.price),2)=32 AND TRIM(l.line_note)='2') OR (ROUND(COALESCE(l.total_money,l.price),2)=35 AND TRIM(l.line_note) IN ('1','3')) OR (ROUND(COALESCE(l.total_money,l.price),2)=45 AND TRIM(l.line_note) IN ('1','2')) OR (ROUND(COALESCE(l.total_money,l.price),2)=49 AND TRIM(l.line_note)='5') OR (ROUND(COALESCE(l.total_money,l.price),2)=54 AND TRIM(l.line_note)='1') OR (ROUND(COALESCE(l.total_money,l.price),2)=55 AND TRIM(l.line_note)='3') OR (ROUND(COALESCE(l.total_money,l.price),2)=65 AND TRIM(l.line_note)='2') OR (ROUND(COALESCE(l.total_money,l.price),2)=69 AND TRIM(l.line_note)='1') OR (ROUND(COALESCE(l.total_money,l.price),2)=5 AND TRIM(l.line_note)='0') GROUP BY sale_price,delivery,l.item_name,l.sku ORDER BY sale_price,delivery,uses DESC,l.item_name;"

      - name: Delivery item profile
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "SELECT TRIM(l.line_note) AS delivery,l.item_name,l.sku,COUNT(*) AS uses,ROUND(MIN(COALESCE(l.total_money,l.price)),2) AS min_price,ROUND(MAX(COALESCE(l.total_money,l.price)),2) AS max_price,ROUND(AVG(COALESCE(l.total_money,l.price)),2) AS avg_price FROM receipt_lines l WHERE TRIM(l.line_note) IN ('0','1','2','3','5') GROUP BY delivery,l.item_name,l.sku ORDER BY delivery,uses DESC,l.item_name;"
