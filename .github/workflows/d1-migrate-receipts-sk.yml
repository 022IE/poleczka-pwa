name: D1 migrate receipts SK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply receipts SK migration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply D1 migrations to poleczka-dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest d1 migrations apply poleczka-dev --remote

      - name: Verify receipts SK
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "PRAGMA table_info(receipts); SELECT sk, COUNT(*) AS receipts FROM receipts GROUP BY sk ORDER BY sk;"
