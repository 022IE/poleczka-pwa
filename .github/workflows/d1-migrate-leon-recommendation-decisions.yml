name: D1 migrate Leon recommendation decisions

on:
  push:
    branches:
      - dev
    paths:
      - migrations/0004_leon_recommendation_decisions.sql
      - .github/workflows/d1-migrate-leon-recommendation-decisions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-migrate-leon-recommendation-decisions
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Leon decisions migration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply D1 migrations to poleczka-dev
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest d1 migrations apply poleczka-dev --remote

      - name: Verify Leon decisions table
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "
            SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'leon_recommendation_decisions';
            SELECT COUNT(*) AS decision_rows FROM leon_recommendation_decisions;
          "
