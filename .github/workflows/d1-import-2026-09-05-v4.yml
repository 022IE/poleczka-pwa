name: D1 Import 2026-09-05 v4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    name: Import 2026-09-05 into poleczka-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run controlled import and verification
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/import-2026-09-05-v4.mjs
