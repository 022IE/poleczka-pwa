name: D1 Inspect delivery_number format

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/d1-inspect-delivery-number.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect deliveries and receipt lines
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest d1 execute poleczka-dev --remote --command "PRAGMA table_info(deliveries); SELECT * FROM deliveries ORDER BY delivery_number LIMIT 20; SELECT delivery_number,typeof(delivery_number) AS value_type,COUNT(*) AS uses FROM receipt_lines GROUP BY delivery_number,typeof(delivery_number) ORDER BY uses DESC LIMIT 30;"
