name: D1 Import 2026-09-09
# retry with line_note + delivery_number compatibility

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/d1-import-2026-09-09.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    name: Import historical sales 2026-09-09
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run historical import
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/import-2026-09-09.mjs
